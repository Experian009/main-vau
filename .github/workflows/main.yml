name: Windows-RDP-BORE
on: workflow_dispatch

jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Enable RDP FIXED
        shell: pwsh
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          netsh advfirewall firewall add rule name="RDP 3389" dir=in action=allow protocol=TCP localport=3389
          netsh advfirewall firewall add rule name="RDP 3389 UDP" dir=in action=allow protocol=UDP localport=3389
          net user runneradmin ${{ secrets.WIN_PASS }}
          net user runneradmin /active:yes
          net localgroup "Remote Desktop Users" runneradmin /add
          net localgroup "Administrators" runneradmin /add
          Restart-Service TermService -Force -ErrorAction SilentlyContinue
          Start-Sleep 5
          netstat -an | findstr 3389
          Write-Host "RDP Ready for runneradmin"

      - name: Install bore
        shell: pwsh
        run: |
          Write-Host "Downloading bore..."
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-pc-windows-msvc.zip" -OutFile bore.zip -UseBasicParsing
          Expand-Archive -Path bore.zip -DestinationPath .
          .\bore.exe --help

      - name: Start bore tunnel for RDP 3389
        shell: pwsh
        run: |
          Write-Host "Starting bore agent..."
          Start-Process -FilePath ".\bore.exe" -ArgumentList "local 3389 --to bore.pub" -NoNewWindow -RedirectStandardOutput bore.log -RedirectStandardError bore-err.log
          Start-Sleep 15
          Write-Host "--- bore log ---"
          Get-Content bore.log -Tail 100
          Get-Content bore-err.log -Tail 50 -ErrorAction SilentlyContinue
          Write-Host "=========================================="
          Write-Host "Найди в логах выше строку вида: listening at bore.pub:12345"
          Write-Host "Это и есть твой RDP адрес!"
          Write-Host "Логин: runneradmin"
          Write-Host "Пароль: из WIN_PASS"
          Write-Host "В mstsc (Подключение к удаленному рабочему столу) вводи адрес bore.pub:12345"
          Write-Host "=========================================="

      # Полностью автономный запуск V380 Event MVP — без каких-либо диалогов.
      # Все значения читаются из GitHub Secrets репозитория (см. README ниже),
      # .env.windows генерируется на лету и никогда не коммитится в git.
      - name: Deploy V380 Event MVP (unattended)
        shell: pwsh
        env:
          V380_CAMERA_ID: ${{ secrets.V380_CAMERA_ID }}
          V380_USERNAME: ${{ secrets.V380_USERNAME }}
          V380_PASSWORD: ${{ secrets.V380_PASSWORD }}
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
          INTERNAL_NOTIFY_TOKEN: ${{ secrets.INTERNAL_NOTIFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TERABOX_NDUS: ${{ secrets.TERABOX_NDUS }}
        run: |
          & "$env:GITHUB_WORKSPACE\v380-event\windows\unattended-deploy.ps1"

      - name: Start bore tunnel for V380 dashboard (port 3000)
        shell: pwsh
        run: |
          Write-Host "Starting second bore agent for the V380 dashboard..."
          Start-Process -FilePath ".\bore.exe" -ArgumentList "local 3000 --to bore.pub" -NoNewWindow -RedirectStandardOutput bore-dashboard.log -RedirectStandardError bore-dashboard-err.log
          Start-Sleep 15
          Write-Host "--- bore dashboard log ---"
          Get-Content bore-dashboard.log -Tail 100 -ErrorAction SilentlyContinue
          Get-Content bore-dashboard-err.log -Tail 50 -ErrorAction SilentlyContinue
          Write-Host "=========================================="
          Write-Host "Строка вида 'listening at bore.pub:XXXXX' выше — адрес веб-интерфейса V380."
          Write-Host "Откройте http://bore.pub:XXXXX в браузере (используйте GATEWAY_TOKEN из секретов при подключении)."
          Write-Host "=========================================="

      - name: Keep VM alive
        shell: pwsh
        run: |
          while($true){
            Write-Host "[$(Get-Date)] runner alive — RDP: см. bore.log, V380 dashboard: см. bore-dashboard.log"
            Get-Content bore.log -Tail 3 -ErrorAction SilentlyContinue
            Get-Content bore-dashboard.log -Tail 3 -ErrorAction SilentlyContinue
            Start-Sleep 60
          }
